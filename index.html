<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Itach Finance</title>

  <!-- PWA meta (לא חובה לשלב הראשון, אבל טוב שיהיה אם כבר יש manifest) -->
  <meta name="theme-color" content="#0d6efd" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    /* ======= תשתית עיצוב מודרנית, מותאם מובייל ======= */
    :root {
      --primary: #0d6efd;
      --primary-600: #0b5ed7;
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --shadow: 0 6px 24px rgba(2, 6, 23, 0.06);
      --radius: 16px;
      --ring: 0 0 0 3px rgba(13, 110, 253, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #101827;
        --text: #e5e7eb;
        --muted: #9aa3b2;
        --shadow: 0 8px 24px rgba(0,0,0,0.35);
      }
    }

    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans"; -webkit-font-smoothing: antialiased; }
    .safe { padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,0.8));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 18px;
    }
    .brand .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      box-shadow: 0 0 0 4px rgba(13,110,253,.15);
    }

    /* Month picker */
    .monthbar {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 10px;
    }
    .monthbar button {
      border: 0; background: var(--card); color: var(--text); width: 36px; height: 36px;
      display: grid; place-items: center; border-radius: 10px; box-shadow: var(--shadow); cursor: pointer;
    }
    .monthbar button:active { transform: translateY(1px); }
    .monthbar .label {
      padding: 8px 12px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow);
      font-weight: 600; letter-spacing: .3px;
    }

    /* Container */
    main { max-width: 520px; margin: 0 auto; padding: 14px 0 28px; }

    /* KPI cards (grid 2x2 במובייל) */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .kpi {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
      position: relative; overflow: hidden;
    }
    .kpi .label { font-size: 13px; color: var(--muted); }
    .kpi .value { font-size: 18px; font-weight: 800; letter-spacing: .2px; }
    .kpi .chip {
      position: absolute; top: 10px; left: 10px; font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: rgba(0,0,0,0.06); color: var(--muted);
    }
    .kpi.income .value { color: var(--success); }
    .kpi.expense .value { color: var(--danger); }
    .kpi.saving .value { color: var(--primary-600); }
    .kpi.over .value { color: var(--warning); }

    /* Card block */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      margin-top: 14px;
    }
    .card h2 { margin: 0 0 6px; font-size: 15px; }

    /* Overrun list (collapsible) */
    details { border-radius: 12px; border: 1px dashed rgba(0,0,0,0.08); padding: 10px; }
    details[open] { background: rgba(13,110,253,0.04); }
    details summary { cursor: pointer; list-style: none; }
    details summary::marker, details summary::-webkit-details-marker { display: none; }
    .over-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .over-item:last-child { border-bottom: none; }
    .badge {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: #fee2e2; color: #991b1b;
    }

    /* Helpers */
    .muted { color: var(--muted); font-size: 12px; }
    .spacer { height: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .ring:focus-visible { box-shadow: var(--ring); outline: none; }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="safe header-inner">
      <div class="brand" aria-label="Itach Finance">
        <div class="dot" aria-hidden="true"></div>
        <span>Itach Finance</span>
      </div>
      <div class="muted" id="today-label"></div>
    </div>

    <div class="safe monthbar">
      <button id="prev-month" class="ring" aria-label="חודש קודם">‹</button>
      <div class="label" id="month-label" aria-live="polite">פברואר 2026</div>
      <button id="next-month" class="ring" aria-label="חודש הבא">›</button>
    </div>
  </header>

  <!-- Main -->
  <main class="safe">
    <!-- KPIs -->
    <section class="grid" aria-label="מדדים חודשיים">
      <div class="kpi income">
        <div class="label">הכנסות</div>
        <div class="value" id="kpi-income">₪0</div>
        <span class="chip">חודשי</span>
      </div>
      <div class="kpi expense">
        <div class="label">הוצאות</div>
        <div class="value" id="kpi-expense">₪0</div>
        <span class="chip">חודשי</span>
      </div>
      <div class="kpi over">
        <div class="label">חריגות</div>
        <div class="value"><span id="kpi-over-amount">₪0</span> <span class="muted">(<span id="kpi-over-count">0</span> קט׳)</span></div>
        <span class="chip">מול תקציב</span>
      </div>
      <div class="kpi saving">
        <div class="label">אפשרי לחיסכון</div>
        <div class="value" id="kpi-saving">₪0</div>
        <span class="chip">הערכה</span>
      </div>
    </section>

    <!-- Overruns detail -->
